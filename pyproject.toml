[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "whatsapp-order-api"
version = "0.1.0"
description = "WhatsApp Order Management REST API"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# CI enforces correctness rules. The pyupgrade (UP) and naming (N) rules can be
# re-enabled once the codebase is migrated to PEP 604/585 annotations.
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
